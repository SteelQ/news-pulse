services:
  # MySQL 数据库服务
  db:
    image: mysql:8.0
    container_name: news-pulse-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-news_pulse}
      MYSQL_USER: ${DB_USERNAME:-news_pulse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-33060}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - news-pulse-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM 应用服务 (Laravel)
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    container_name: news-pulse-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
    networks:
      - news-pulse-network
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-news_pulse}
      - DB_USERNAME=${DB_USERNAME:-news_pulse}
      - DB_PASSWORD=${DB_PASSWORD:-password}

  # Nginx Web 服务器
  web:
    image: nginx:alpine
    container_name: news-pulse-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - news-pulse-network

  # Node.js 前端开发服务 (Vue 3 + Vite)
  node:
    build:
      context: ./docker
      dockerfile: Dockerfile.node
    container_name: news-pulse-node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - news-pulse-network
    environment:
      # 默认使用相对路径，确保走 Vite 代理避免跨域
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
    driver: local

networks:
  news-pulse-network:
    driver: bridge
